<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KataSaham | Portfolio Tracker Indonesia</title>
    <meta name="description" content="Pencatatan portofolio saham IDX dengan kalkulasi average price dan pembukuan tahunan.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div id="app">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">📊</span>
                <h1>KataSaham</h1>
            </div>
            <nav class="main-nav">
                <button data-page="dashboard" class="nav-link active">Dashboard</button>
                <button data-page="transactions" class="nav-link">Transaksi</button>
                <button data-page="dividends" class="nav-link">Dividen</button>
                <button data-page="dca" class="nav-link">DCA Advisor</button>
                <button data-page="reports" class="nav-link">Laporan</button>
                <button data-page="management" class="nav-link">Manajemen</button>
                <button data-page="user-management" class="nav-link" id="nav-user-management" style="display:none;">Users</button>
                <button data-page="settings" class="nav-link">Pengaturan</button>
            </nav>
            <div class="selectors-container" style="display: flex; gap: 1rem; align-items: center;">
                <div class="account-selector">
                    <select id="active-account">
                        <!-- Accounts will be injected here -->
                    </select>
                </div>
                <div class="period-selector">
                    <select id="active-period">
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="all">Semua Periode</option>
                    </select>
                </div>
                
                <div class="user-profile-dropdown" id="user-profile-dropdown" style="display:none;">
                    <button class="profile-toggle" id="profile-toggle">
                        <span id="user-initials">?</span>
                    </button>
                    <div class="dropdown-menu" id="profile-menu">
                        <div class="menu-user-info">
                            <strong id="menu-user-name">User</strong>
                            <span id="menu-user-role" class="badge neutral">Role</span>
                        </div>
                        <hr>
                        <button class="dropdown-item nav-link" data-page="settings">Pengaturan Profil</button>
                        <button class="dropdown-item logout-btn" id="header-logout-btn">Keluar (Logout)</button>
                    </div>
                </div>
            </div>
        </header>

        <main id="main-content">
            <!-- Content will be injected here -->
            <div class="loader">Memuat data...</div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2026 KataSaham Project. <span id="status-dot"></span> Sistem Siap.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
