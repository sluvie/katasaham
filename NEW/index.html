<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KataSaham | Portfolio Tracker Indonesia</title>
    <meta name="description" content="Pencatatan portofolio saham IDX dengan kalkulasi average price dan pembukuan tahunan.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div id="app">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">📊</span>
                <h1>KataSaham</h1>
            </div>
            <nav class="main-nav">
                <button data-page="dashboard" class="nav-link active">Dashboard</button>
                <button data-page="transactions" class="nav-link">Transaksi</button>
                <button data-page="dividends" class="nav-link">Dividen</button>
                <button data-page="dca" class="nav-link">DCA Advisor</button>
                <button data-page="reports" class="nav-link">Laporan</button>
                <button data-page="settings" class="nav-link">Pengaturan</button>
            </nav>
            <div class="period-selector">
                <select id="active-period">
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="all">Semua Periode</option>
                </select>
            </div>
        </header>

        <main id="main-content">
            <!-- Content will be injected here -->
            <div class="loader">Memuat data...</div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2026 KataSaham Project. <span id="status-dot"></span> Sistem Siap.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
